name: Generar ejecutable de Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: python tools/build_exe.py
      - run: python -c "import shutil; shutil.make_archive('ConexionesMetalicas_Windows', 'zip', 'dist')"
      - uses: actions/upload-artifact@v4
        with:
          name: ConexionesMetalicas_Windows
          path: ConexionesMetalicas_Windows.zip
